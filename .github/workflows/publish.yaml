name: CI/CD — Build, Test & Publish

on:
  release:
    types:
      - published

env:
  DOCKER_HUB_REGISTRY: ${{ vars.DOCKER_HUB_REGISTRY || 'docker.io' }}
  DOCKER_HUB_REPOSITORY: ${{ vars.DOCKER_HUB_REPOSITORY || format('{0}/optisalud-plus-backend', vars.DOCKER_HUB_USERNAME) }}


jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: optisalud_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Java 25 with Gradle cache
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'          # Caches ~/.gradle/caches + ~/.gradle/wrapper automatically

      - name: Build and Test
        run: ./gradlew build --no-daemon --console=plain
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: optisalud_test
          DATABASE_SSL_MODE: disable
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres


  # Verify secrets before attempting Docker Hub push
  check-secrets-dhr:
    name: Check if Docker Hub registry information was set on secrets
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    outputs:
      is_have_secrets: ${{ steps.check_secret_job.outputs.is_have_secrets }}
    steps:
      - id: check_secret_job
        run: |
          if [[ "${{ vars.DOCKER_HUB_USERNAME }}" != "" && \
                "${{ secrets.DOCKER_HUB_TOKEN }}" != "" ]]; \
          then
            echo "Secrets/Variables to use a container registry are configured in the repo"
            echo "is_have_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "Secrets/Variables to use a container registry were not configured in the repo"
            echo "is_have_secrets=false" >> $GITHUB_OUTPUT
          fi


  push-alpine-image-dhr:
    name: Build and push Docker Alpine image
    needs:
      - check-secrets-dhr
    if: needs.check-secrets-dhr.outputs.is_have_secrets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Push to docker repository
        run: echo "Pushing to Docker repository ${{ env.DOCKER_HUB_REPOSITORY }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_HUB_REGISTRY }}
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata (Alpine)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_REPOSITORY }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,suffix=-alpine
            type=raw,value=alpine,enable=${{ !github.event.release.prerelease }}

      - name: Build and Push Docker Alpine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/alpine.Dockerfile
          # Compile from source inside the build. Without this, the build defaults
          # to the last stage (from-prebuilt), which expects a JAR fed via
          # build-contexts (used by ci.yaml) and ships an empty image on release.
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            DEPLOY_VERSION=${{ github.event.release.tag_name }}
            BUILD_VERSION=${{ github.event.release.tag_name }}
            BUILD_DATE=${{ github.event.release.published_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Releases must always compile from the checked-out source. A shared GHA
          # layer cache once shipped a stale JAR (old code under a new tag), so we
          # build from scratch here — releases are infrequent and correctness wins.
          no-cache: true


  push-debian-image-dhr:
    name: Build and push Docker Debian image
    needs:
      - check-secrets-dhr
    if: needs.check-secrets-dhr.outputs.is_have_secrets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Push to docker repository
        run: echo "Pushing to Docker repository ${{ env.DOCKER_HUB_REPOSITORY }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_HUB_REGISTRY }}
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata (Debian)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_REPOSITORY }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and Push Docker Debian image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/debian.Dockerfile
          # Compile from source inside the build. Without this, the build defaults
          # to the last stage (from-prebuilt), which expects a JAR fed via
          # build-contexts (used by ci.yaml) and ships an empty image on release.
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            DEPLOY_VERSION=${{ github.event.release.tag_name }}
            BUILD_VERSION=${{ github.event.release.tag_name }}
            BUILD_DATE=${{ github.event.release.published_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Releases must always compile from the checked-out source. A shared GHA
          # layer cache once shipped a stale JAR (old code under a new tag), so we
          # build from scratch here — releases are infrequent and correctness wins.
          no-cache: true
