name: CI — Build & Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-and-test:
    name: Build, Test & Validate Dockerfiles
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: optibienestar360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Java 25 with Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and Test
        run: ./gradlew build --no-daemon --console=plain
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: optibienestar360_test
          DATABASE_SSL_MODE: disable
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 3

      # - name: Upload JAR artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-jar
      #     path: build/libs/
      #     retention-days: 1
      #     if-no-files-found: error

      # Validate both Dockerfiles in this same job: the JAR built above stays in
      # build/libs/ on the runner and is fed to the `from-prebuilt` stage via a
      # build-context — no cross-job artifact upload (avoids GitHub artifact-storage
      # quota on private repos). Both images build, none are pushed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Alpine image (build, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/alpine.Dockerfile
          target: from-prebuilt
          build-contexts: |
            prebuilt-src=build/libs/
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-alpine
          cache-to: type=gha,mode=max,scope=docker-alpine

      - name: Validate Debian image (build, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/debian.Dockerfile
          target: from-prebuilt
          build-contexts: |
            prebuilt-src=build/libs/
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-debian
          cache-to: type=gha,mode=max,scope=docker-debian
