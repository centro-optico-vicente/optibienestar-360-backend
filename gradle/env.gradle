// ═════════════════════════════════════════════════════════════════
// gradle/env.gradle — loader de .env reutilizable desde cualquier tarea.
//
// Expone en `ext` del proyecto que lo aplica:
//   - dotEnvMap           : Map<String,String> curado del .env
//   - env(key, default)   : Provider<String> lazy (.env > System.getenv > default)
//   - flywayPlaceholders(): Map<String,String> derivado de application*.properties
// ═════════════════════════════════════════════════════════════════

import java.util.Properties

ext {
	// ─── Parser de .env ───
	// Formato: KEY=value por línea. Ignora líneas vacías y comentarios (#).
	// Quita comillas simples o dobles envolventes (no interpreta escapes).
	_loadDotEnv = { File f ->
		def map = [:]
		if (f.exists()) {
			f.eachLine { line ->
				def t = line.trim()
				if (!t || t.startsWith('#')) {
					return
				}
				int eq = t.indexOf('=')
				if (eq <= 0) {
					return
				}
				def k = t.substring(0, eq).trim()
				def v = t.substring(eq + 1).trim()
				if ((v.startsWith('"') && v.endsWith('"')) ||
					(v.startsWith("'") && v.endsWith("'"))) {
					v = v.substring(1, v.length() - 1)
				}
				map[k] = v
			}
		}
		map
	}

	// Mapa curado — solo claves declaradas por el equipo en .env.
	// NUNCA uses System.getenv() completo aquí: filtraría PATH/HOME,
	// sería no determinista entre máquinas y podría inyectar secretos
	// del CI al historial de Flyway (flyway_schema_history guarda SQL resuelto).
	dotEnvMap = _loadDotEnv(project.rootProject.file('.env'))

	// Provider lazy: no lee el .env hasta que una tarea lo pide.
	// Precedencia idéntica a Spring Boot: .env > System.getenv > default.
	env = { String key, String defaultValue = null ->
		project.providers.provider {
			dotEnvMap[key] ?: System.getenv(key) ?: defaultValue
		}
	}

	// ─── Parser de .properties estilo Spring ───
	// Properties.load(InputStream) usa ISO-8859-1 por defecto; application*.properties
	// de Spring se guardan así. Si añades acentos/UTF-8, cambia a load(Reader).
	_loadProps = { File f ->
		def p = new Properties()
		if (f.exists()) f.withInputStream { p.load(it) }
		p
	}

	// Resuelve referencias Spring ${VAR:default} / ${VAR} usando env(),
	// para mantener exactamente la misma precedencia que en runtime.
	_resolveSpringRefs = { String raw ->
		raw.replaceAll(/\$\{([^:}]+)(?::([^}]*))?\}/) { m, key, defVal ->
			env(key.toString(), defVal ?: '').get()
		}
	}

	// Deriva placeholders de Flyway desde spring.flyway.placeholders.*
	// en application.properties + application-dev.properties (dev gana,
	// igual que la precedencia de perfiles de Spring Boot).
	// Añadir un placeholder nuevo en Spring no requiere tocar build.gradle.
	flywayPlaceholders = {
		def base = _loadProps(project.file('src/main/resources/application.properties'))
		def dev  = _loadProps(project.file('src/main/resources/application-dev.properties'))
		def merged = new Properties()
		merged.putAll(base)
		merged.putAll(dev)
		def out = [:]
		merged.each { k, v ->
			def key = k.toString()
			if (key.startsWith('spring.flyway.placeholders.')) {
				def name = key.substring('spring.flyway.placeholders.'.length())
				out[name] = _resolveSpringRefs(v.toString())
			}
		}
		out
	}
}
