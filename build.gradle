buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		// Needed so the custom flywayInfo / flywayValidate tasks can import
		// org.flywaydb.core.Flyway and the PostgreSQL driver at script level.
		classpath "org.flywaydb:flyway-core:11.7.2"
		classpath "org.flywaydb:flyway-database-postgresql:11.7.2"
		classpath "org.postgresql:postgresql:42.7.11"
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	// id "io.github.uoxx3.project-environment" version "1.0.1"
	// id 'org.flywaydb.flyway' version '11.7.2'
	id 'net.ltgt.flyway' version '1.0.0'
}

import org.flywaydb.core.Flyway
import org.flywaydb.core.api.MigrationInfo

apply from: 'gradle/env.gradle'

group = 'com.fenixcore'
version = findProperty("deployVersion") ?: "local-0.0.1"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Core
	implementation("org.springframework.boot:spring-boot-starter-web") {
		exclude group: "org.springframework.boot", module: "spring-boot-starter-tomcat"
	}
	implementation "org.springframework.boot:spring-boot-starter-jetty"
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'

	// Persistence + Migrations
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	// Spring Boot 4 split Flyway auto-config out of spring-boot-autoconfigure into the
	// spring-boot-flyway module (shipped via spring-boot-starter-flyway). Without this
	// starter the FlywayAutoConfiguration class is absent from the classpath and the
	// flywayInitializer bean is never created — migrations silently never run.
	runtimeOnly "org.postgresql:postgresql:42.7.11"
	implementation "org.flywaydb:flyway-database-postgresql"
	implementation "org.springframework.boot:spring-boot-starter-flyway"
	flyway "org.flywaydb:flyway-core:11.7.2"
	flyway "org.flywaydb:flyway-database-postgresql:11.7.2"
	flyway "org.postgresql:postgresql:42.7.11"

	// Security
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "io.jsonwebtoken:jjwt-api:0.13.0"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:0.13.0"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.13.0"

	// Cache — Redis used when auth.token-blacklist.provider=redis (default);
	// Caffeine is the in-process fallback for single-replica deployments.
	implementation "org.springframework.boot:spring-boot-starter-cache"
	implementation "org.springframework.boot:spring-boot-starter-data-redis"
	implementation "com.github.ben-manes.caffeine:caffeine"

	// Storage (AWS SDK v2 for Cloudflare R2 via S3 API)
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:4.0.2'
	implementation 'org.springframework.boot:spring-boot-jackson2'

	// Email
	implementation "org.springframework.boot:spring-boot-starter-mail"
	implementation "org.springframework.boot:spring-boot-starter-thymeleaf"

	// QR codes (member digital card, vertical-9) — Apache-2.0, OSS (ADR 0004)
	implementation "com.google.zxing:core:3.5.3"
	implementation "com.google.zxing:javase:3.5.3"

	// API and Tools
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3"
	implementation "io.github.perplexhub:rsql-jpa-spring-boot-starter:7.0.0"
	implementation "org.mapstruct:mapstruct:1.6.3"
	annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
	compileOnly "org.projectlombok:lombok"
	annotationProcessor "org.projectlombok:lombok"
	annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

	// Async retry (aspectjweaver already on classpath transitively via spring-boot-starter-aspectj)
	implementation "org.springframework.retry:spring-retry:2.0.12"

	// Jasper Reports
	implementation 'net.sf.jasperreports:jasperreports:6.21.4'
	implementation 'net.sf.jasperreports:jasperreports-fonts:6.21.4'

	// Excel / POI for export XLSX
	implementation 'org.apache.poi:poi:4.1.2'
	implementation 'org.apache.poi:poi-ooxml:4.1.2'

	// Generic Document report engine (HTML -> PDF and FastExcel XLSX)
	implementation 'io.github.openhtmltopdf:openhtmltopdf-core:1.1.22'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.22'
	implementation 'org.dhatim:fastexcel:0.18.4'

	// Monitoring
	implementation "org.springframework.boot:spring-boot-starter-actuator"
	implementation "net.logstash.logback:logstash-logback-encoder:8.0"

	// Tests
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "org.springframework.security:spring-security-test"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly 'com.h2database:h2'
}

def jvmJasperArgs = [
	'-Djava.awt.headless=true',
	'--add-opens=java.base/java.lang=ALL-UNNAMED',
	'--add-opens=java.base/java.util=ALL-UNNAMED',
	'--add-opens=java.desktop/sun.awt=ALL-UNNAMED',
	'--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
]

tasks.named('bootRun') {
	jvmArgs = jvmJasperArgs
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs = jvmJasperArgs
	// The @SpringBootTest controller ITs each cache a full ApplicationContext
	// (Hibernate SessionFactory + metamodel). As the suite grew across verticals
	// the default fork heap ran out (OutOfMemoryError building a fresh context).
	maxHeapSize = '2g'
}

test {
	testLogging {
		events "failed"
		exceptionFormat = "full"
		showStandardStreams = true
	}
}


// ─────────────────────────────────────────────────────────────────
// Flyway configuration
// ─────────────────────────────────────────────────────────────────

def dbHost     = env('DATABASE_HOST',     'localhost')
def dbPort     = env('DATABASE_PORT',     '5432')
def dbName     = env('DATABASE_NAME',     'optibienestar360')
def dbSslMode  = env('DATABASE_SSL_MODE', 'disable')
def dbUser     = env('DATABASE_MIGRATION_USER',     'optibienestar360_migration')
def dbPassword = env('DATABASE_MIGRATION_PASSWORD', 'changeme-dev')

// Build the JDBC URL lazily — the .env is read only when a Flyway task runs.
def jdbcUrl = providers.provider {
	"jdbc:postgresql://${dbHost.get()}:${dbPort.get()}/${dbName.get()}" +
	"?sslmode=${dbSslMode.get()}&stringtype=unspecified"
}

flyway {
	url = jdbcUrl
	user     = dbUser.get()
	password = dbPassword.get()

	// The Gradle plugin runs outside the application classpath, so
	// `classpath:db/migration` cannot be resolved. Point to the filesystem.
	migrationLocations = files('src/main/resources/db/migration')

	// Everything else goes through the `configuration` map, which is passed
	// straight to Flyway. Keys are Flyway property names (camelCase).
	configuration = [
		schemas           : 'app',
		baselineOnMigrate : true,
		baselineVersion   : '0',
		outOfOrder        : true,
		validateOnMigrate : true,
		// ⚠️ WARNING: cleanDisabled=false enables `flywayClean`, which
		// DROPS all objects in the configured schemas. Only safe against
		// a local/dev database. Set to true in CI or prod.
		cleanDisabled     : false,
		placeholders      : flywayPlaceholders()
	].collectEntries { k, v -> [k, v?.toString()] }
}

// ─────────────────────────────────────────────────────────────────
// Custom Flyway tasks — net.ltgt.flyway ships only flywayMigrate,
// flywayClean and flywayRepair. flywayInfo / flywayValidate are
// implemented on top of the Flyway Java API.
//
// Helper: builds a Flyway instance with the same configuration as the
// extension above so all tasks stay in sync.
// ─────────────────────────────────────────────────────────────────
def buildFlyway = {
	Flyway.configure()
		.dataSource(jdbcUrl.get(), dbUser.get(), dbPassword.get())
		.schemas('app')
		.locations('filesystem:src/main/resources/db/migration')
		.baselineOnMigrate(true)
		.baselineVersion('0')
		.outOfOrder(true)
		.validateOnMigrate(true)
		.cleanDisabled(false)
		.placeholders(flywayPlaceholders())
		.load()
}

tasks.register('flywayInfo') {
	group       = 'flyway'
	description = 'Prints the details and status information about all migrations.'

	doLast {
		def flyway = buildFlyway()
		def info   = flyway.info()

		println "Schema history table: ${flyway.configuration.defaultSchema ?: 'app'}.flyway_schema_history"
		println "─" * 80

		info.all().each { MigrationInfo m ->
			def version     = m.version ? m.version.toString() : '<< repeatable >>'
			def state       = m.state?.displayName ?: 'UNKNOWN'
			def type        = m.type?.name() ?: 'UNKNOWN'
			def description = m.description ?: ''
			printf("%-12s | %-12s | %-10s | %s%n", version, state, type, description)
		}
	}
}

tasks.register('flywayValidate') {
	group       = 'flyway'
	description = 'Validates applied migrations against the local ones; fails on drift.'

	doLast {
		buildFlyway().validate()
		println '✔ Flyway validation passed — no drift detected.'
	}
}

tasks.register('checkFlywayState') {
	group       = 'verification'
	description = 'CI entry point — fails the build when Flyway detects drift.'
	dependsOn 'flywayValidate'
}
