plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	// id "io.github.uoxx3.project-environment" version "1.0.1"
}

group = 'com.fenixcore'
version = findProperty("deployVersion") ?: "local-0.0.1"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Core
	// implementation "org.springframework.boot:spring-boot-starter"
	implementation("org.springframework.boot:spring-boot-starter-web") {
		exclude group: "org.springframework.boot", module: "spring-boot-starter-tomcat"
	}
	implementation "org.springframework.boot:spring-boot-starter-jetty"
	// implementation "org.springframework.boot:spring-boot-starter-aop"
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'

	// Persistence
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	runtimeOnly "org.postgresql:postgresql:42.7.11"

	// Security
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "io.jsonwebtoken:jjwt-api:0.13.0"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:0.13.0"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.13.0"

	// Cache
	implementation "org.springframework.boot:spring-boot-starter-cache"
	implementation "org.springframework.boot:spring-boot-starter-data-redis"

	// Storage
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:4.0.2'
	implementation 'org.springframework.boot:spring-boot-jackson2' // Future versions of Spring Boot are being migrated to version 3 and remove this

	// API and Tools
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3" // Swagger UI
	implementation "io.github.perplexhub:rsql-jpa-spring-boot-starter:7.0.0" // Advances filters
	implementation "org.mapstruct:mapstruct:1.6.3"
	annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"

	// Monitoring
	implementation "org.springframework.boot:spring-boot-starter-actuator"

	// Tests
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}
