plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	// id "io.github.uoxx3.project-environment" version "1.0.1"
}

group = 'com.fenixcore'
version = findProperty("deployVersion") ?: "local-0.0.1"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Core
	implementation("org.springframework.boot:spring-boot-starter-web") {
		exclude group: "org.springframework.boot", module: "spring-boot-starter-tomcat"
	}
	implementation "org.springframework.boot:spring-boot-starter-jetty"
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'

	// Persistence + Migrations
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	// Spring Boot 4 split Flyway auto-config out of spring-boot-autoconfigure into the
	// spring-boot-flyway module (shipped via spring-boot-starter-flyway). Without this
	// starter the FlywayAutoConfiguration class is absent from the classpath and the
	// flywayInitializer bean is never created — migrations silently never run.
	implementation "org.springframework.boot:spring-boot-starter-flyway"
	implementation "org.flywaydb:flyway-database-postgresql"
	runtimeOnly "org.postgresql:postgresql:42.7.11"

	// Security
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "io.jsonwebtoken:jjwt-api:0.13.0"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:0.13.0"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.13.0"

	// Cache — Redis used when auth.token-blacklist.provider=redis (default);
	// Caffeine is the in-process fallback for single-replica deployments.
	implementation "org.springframework.boot:spring-boot-starter-cache"
	implementation "org.springframework.boot:spring-boot-starter-data-redis"
	implementation "com.github.ben-manes.caffeine:caffeine"

	// Storage (AWS SDK v2 for Cloudflare R2 via S3 API)
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:4.0.2'
	implementation 'org.springframework.boot:spring-boot-jackson2'

	// Email
	implementation "org.springframework.boot:spring-boot-starter-mail"
	implementation "org.springframework.boot:spring-boot-starter-thymeleaf"

	// API and Tools
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3"
	implementation "io.github.perplexhub:rsql-jpa-spring-boot-starter:7.0.0"
	implementation "org.mapstruct:mapstruct:1.6.3"
	annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
	compileOnly "org.projectlombok:lombok"
	annotationProcessor "org.projectlombok:lombok"
	annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

	// Async retry (aspectjweaver already on classpath transitively via spring-boot-starter-aspectj)
	implementation "org.springframework.retry:spring-retry:2.0.12"

	// Monitoring
	implementation "org.springframework.boot:spring-boot-starter-actuator"
	implementation "net.logstash.logback:logstash-logback-encoder:8.0"

	// Tests
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}
