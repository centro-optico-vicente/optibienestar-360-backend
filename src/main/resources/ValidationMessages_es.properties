# Spanish base bundle for Jakarta Bean Validation messages. Covers `es`,
# `es-VE`, `es-MX`, `es-AR`, … via ResourceBundle fallback. Hibernate
# Validator looks up `{validation.xxx}` placeholders against this bundle via
# the `LocalValidatorFactoryBean` wired to the MessageSource (I18nConfig).

validation.locale.allowed=el idioma debe ser 'es', 'es-VE' o 'en'
validation.document_type.format=El tipo de documento debe ser 'V' o 'E'
validation.user_status.allowed_values=El estado debe ser 'ACTIVE', 'SUSPENDED' o 'LOCKED'
validation.code.uppercase.single=El código debe ser una sola letra mayúscula
validation.code.uppercase.short=El código debe tener entre 1 y 3 letras mayúsculas
validation.code.uppercase.medium=El código debe tener entre 1 y 20 letras mayúsculas o guion bajo
validation.code.uppercase.long=El código debe tener entre 1 y 40 letras mayúsculas o guion bajo
validation.iso_code.alpha2=El isoCode debe ser 2 letras mayúsculas (ISO 3166-1 alpha-2)
