# WEB SERVER
server.port=${SERVER_PORT:8080}
server.jetty.threads.min=10
server.jetty.threads.max=200
server.jetty.threads.idle-timeout=60000ms

# DATABASE — URL composed from split env vars (no defaults in prod: fail fast if missing)
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=${DATABASE_SSL_MODE}&stringtype=unspecified
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HIKARI CONNECTION POOL
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# CACHE (Redis in prod)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# STORAGE (Cloudflare R2)
storage.r2.endpoint=${STORAGE_R2_ENDPOINT}
storage.r2.access-key=${STORAGE_R2_ACCESS_KEY}
storage.r2.secret-key=${STORAGE_R2_SECRET_KEY}
storage.r2.bucket=${STORAGE_R2_BUCKET:optibienestar-360-prod}
storage.r2.region=${STORAGE_R2_REGION:auto}
storage.r2.public-bucket=${STORAGE_R2_PUBLIC_BUCKET:optibienestar-360-prod-public}
storage.r2.public-base-url=${STORAGE_R2_PUBLIC_BASE_URL}
spring.cloud.aws.s3.enabled=false

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# LOGGING — levels managed by logback-spring.xml
