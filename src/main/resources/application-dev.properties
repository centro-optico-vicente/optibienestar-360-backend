# WEB SERVER
server.port=${SERVER_PORT:8080}
server.jetty.threads.min=10
server.jetty.threads.max=100
server.jetty.threads.idle-timeout=60000ms

# CORS — debug: allow localhost / 127.0.0.1 on any port (in addition to cors.allowed-origins)
cors.allow-localhost=true

# DATABASE — runtime connection uses app role (DML only)
# URL composed from split env vars; aligns with hub `centro-optico-vicente/deployment/env_template.env`
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5413}/${DATABASE_NAME:optibienestar360}?sslmode=${DATABASE_SSL_MODE:disable}&stringtype=unspecified
spring.datasource.username=${DATABASE_USER:optibienestar360_app}
spring.datasource.password=${DATABASE_PASSWORD:changeme-dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.user=${DATABASE_MIGRATION_USER:optibienestar360_migration}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true
# Seed users (V8) in dev: password never expires - avoids rotation friction in local dev
spring.flyway.placeholders.seed_password_never_expires=true

# AUTH / TOKEN BLACKLIST — memory by default for dev local without Redis
auth.token-blacklist.provider=${AUTH_TOKEN_BLACKLIST_PROVIDER:memory}

# CACHE (simple in-memory for dev)
spring.cache.type=simple

# REDIS — required for token blacklist and refresh token store
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# STORAGE (MinIO for dev — see .ai/specs/08-storage-r2.md)
storage.r2.endpoint=${STORAGE_R2_ENDPOINT:http://localhost:9000}
storage.r2.access-key=${STORAGE_R2_ACCESS_KEY:minioadmin}
storage.r2.secret-key=${STORAGE_R2_SECRET_KEY:minioadmin}
storage.r2.bucket=${STORAGE_R2_BUCKET:optibienestar-360-dev}
storage.r2.region=${STORAGE_R2_REGION:us-east-1}
storage.r2.public-bucket=${STORAGE_R2_PUBLIC_BUCKET:optibienestar-360-dev-public}
storage.r2.public-base-url=${STORAGE_R2_PUBLIC_BASE_URL:http://localhost:9000/optibienestar-360-dev-public}
spring.cloud.aws.s3.enabled=false

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# LOGGING — levels managed by logback-spring.xml
