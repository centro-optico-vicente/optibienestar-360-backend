# WEB SERVER
server.port=${SERVER_PORT:8080}
server.jetty.threads.min=10
server.jetty.threads.max=100
server.jetty.threads.idle-timeout=60000ms

# DATABASE
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/optisalud}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# CACHE (simple in-memory for dev)
spring.cache.type=simple

# REDIS (disabled in dev unless explicit)
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}

# STORAGE (MinIO for dev — see .ai/specs/08-storage-r2.md)
storage.r2.endpoint=${STORAGE_R2_ENDPOINT:http://localhost:9000}
storage.r2.access-key=${STORAGE_R2_ACCESS_KEY:minioadmin}
storage.r2.secret-key=${STORAGE_R2_SECRET_KEY:minioadmin}
storage.r2.bucket=${STORAGE_R2_BUCKET:optisalud-dev}
storage.r2.region=${STORAGE_R2_REGION:us-east-1}
spring.cloud.aws.s3.enabled=false

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# LOGGING
logging.level.org.springframework=INFO
logging.level.com.fenixcore=DEBUG
logging.level.org.flywaydb=INFO
