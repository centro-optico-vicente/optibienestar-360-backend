# Canonical fallback bundle for Jakarta Bean Validation messages
# (`@Pattern(message = "{validation.code.xxx}")`, `@NotBlank(message =
# "{validation.required}")`, etc.). Routed through Spring's MessageSource
# via `LocalValidatorFactoryBean.setValidationMessageSource` in I18nConfig,
# so the same fallback chain (locale-specific → base language → this file)
# applies. English text by convention — see messages.properties for the same
# rationale.
#
# Fill order: populated during Fase 3 of the i18n vertical (Jakarta validation
# retrofit).
