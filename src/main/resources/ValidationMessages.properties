# Canonical fallback bundle for Jakarta Bean Validation messages. English by
# convention so a request with a locale outside `es*` / `en*` still gets
# readable text instead of the raw `{validation.xxx}` placeholder. Kept in
# sync with ValidationMessages_en.properties.

validation.locale.allowed=locale must be 'es', 'es-VE' or 'en'
validation.document_type.format=documentType must be 'V' or 'E'
validation.tax_document_type.format=taxDocumentType must be one of 'J','V','E','G','P'
validation.user_status.allowed_values=status must be 'ACTIVE', 'SUSPENDED' or 'LOCKED'
validation.code.uppercase.single=code must be a single uppercase letter
validation.code.uppercase.short=code must be 1-3 uppercase letters
validation.code.uppercase.medium=code must be 1-20 uppercase letters or underscore
validation.code.uppercase.long=code must be 1-40 uppercase letters or underscore
validation.iso_code.alpha2=isoCode must be 2 uppercase letters (ISO 3166-1 alpha-2)
validation.currency.code=code must be 3-4 uppercase letters (ISO 4217 or pseudo-code)
validation.payment_category.direction=direction must be 'IN' or 'OUT'
validation.document_number.venezuelan_format=Document number must be 1 to 9 digits
validation.age.minimum=Age must be at least {value} years
validation.blood_type.format=Blood type must be one of A+, A-, B+, B-, AB+, AB-, O+, O-
validation.permission_uuids.required=The permission list is required (send an empty list to remove all permissions)
validation.user_uuid.required=The user uuid is required
