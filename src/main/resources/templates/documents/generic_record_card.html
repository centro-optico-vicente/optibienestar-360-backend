<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${model.title} ?: #{document.record_card.default_title}">Record Card</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 15mm;
            @bottom-right {
                content: "Page " counter(page) " / " counter(pages);
                font-family: sans-serif;
                font-size: 8pt;
                color: #666666;
            }
            @bottom-left {
                content: "OptiBienestar 360 / Centro Óptico Vicente";
                font-family: sans-serif;
                font-size: 8pt;
                color: #666666;
            }
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 10pt;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            line-height: 1.4;
        }

        .header-table {
            width: 100%;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header-title {
            font-size: 16pt;
            font-weight: bold;
            color: #0056b3;
            margin: 0;
        }

        .header-subtitle {
            font-size: 10pt;
            color: #555555;
            margin: 3px 0 0 0;
        }

        .meta-box {
            text-align: right;
            font-size: 8pt;
            color: #666666;
        }

        .section-header {
            background-color: #f1f5f9;
            color: #1e293b;
            font-size: 11pt;
            font-weight: bold;
            padding: 6px 10px;
            border-left: 4px solid #0056b3;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .fields-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .fields-table td {
            padding: 6px 8px;
            vertical-align: top;
            border-bottom: 1px solid #e2e8f0;
        }

        .field-label {
            font-weight: bold;
            color: #475569;
            width: 35%;
            background-color: #f8fafc;
        }

        .field-value {
            color: #0f172a;
            width: 65%;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 9pt;
        }

        .detail-table th {
            background-color: #0056b3;
            color: #ffffff;
            font-weight: bold;
            padding: 6px;
            text-align: left;
            border: 1px solid #0056b3;
        }

        .detail-table td {
            padding: 5px 6px;
            border: 1px solid #cbd5e1;
        }

        .detail-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 8pt;
            color: #94a3b8;
            border-top: 1px dashed #cbd5e1;
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <table class="header-table">
        <tr>
            <td style="vertical-align: middle;">
                <h1 class="header-title" th:text="${model.title} ?: #{document.record_card.default_title}">Record Card</h1>
                <p class="header-subtitle" th:if="${model.subtitle}" th:text="${model.subtitle}">Information Subtitle</p>
            </td>
            <td class="meta-box" style="vertical-align: middle;">
                <div th:if="${model.identifier}"><strong th:text="#{document.meta.folio}">Folio:</strong> <span th:text="${model.identifier}">ID-1234</span></div>
                <div><strong th:text="#{document.meta.issued_at}">Issued At:</strong> <span th:text="${model.generatedAt}">13/08/2026</span></div>
                <div><strong th:text="#{document.meta.generated_by}">Generated By:</strong> <span th:text="${model.generatedBy} ?: #{document.meta.system_user}">System</span></div>
            </td>
        </tr>
    </table>

    <div class="section-header" th:text="#{document.record_card.main_info}">Main Information</div>

    <table class="fields-table">
        <tr th:each="entry : ${model.fields}">
            <td class="field-label" th:text="${entry.key}">Field</td>
            <td class="field-value" th:text="${entry.value}">Value</td>
        </tr>
    </table>

    <div th:each="section : ${model.detailSections}">
        <div class="section-header" th:text="${section.title} ?: #{document.record_card.detail_section}">Detail Section</div>
        <table class="detail-table">
            <thead>
                <tr>
                    <th th:each="header : ${section.headers}" th:text="${header}">Header</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${section.rows}">
                    <td th:each="cell : ${row}" th:text="${cell}">Cell Value</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer-note" th:text="#{document.footer.audit_note}">
        This document is an official printout generated by the OptiBienestar 360 ecosystem. Auditable document.
    </div>

</body>
</html>
