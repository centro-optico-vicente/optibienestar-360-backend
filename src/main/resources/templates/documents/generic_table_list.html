<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title th:text="${model.title} ?: #{document.table_list.default_title}">Record List</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 12mm;

            @bottom-right {
                content: "Page " counter(page) " / " counter(pages);
                font-family: sans-serif;
                font-size: 8pt;
                color: #666666;
            }
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 9pt;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            line-height: 1.3;
        }

        .header-table {
            width: 100%;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 15pt;
            font-weight: bold;
            color: #0056b3;
            margin: 0;
        }

        .header-subtitle {
            font-size: 9pt;
            color: #555555;
            margin: 2px 0 0 0;
        }

        .meta-box {
            text-align: right;
            font-size: 8pt;
            color: #666666;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
            table-layout: fixed;
        }

        .data-table th {
            background-color: #0056b3;
            color: #ffffff;
            font-weight: bold;
            padding: 6px 4px;
            text-align: left;
            border: 1px solid #0056b3;
            font-size: 8pt;
        }

        .data-table td {
            padding: 5px 4px;
            border: 1px solid #cbd5e1;
            font-size: 8pt;
            vertical-align: top;
        }

        .data-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .footer-summary {
            margin-top: 15px;
            font-size: 8.5pt;
            color: #475569;
            border-top: 1px solid #cbd5e1;
            padding-top: 6px;
        }
    </style>
</head>

<body>

    <table class="header-table">
        <tr>
            <td style="vertical-align: middle;">
                <h1 class="header-title" th:text="${model.title} ?: #{document.table_list.default_title}">Record List
                </h1>
                <p class="header-subtitle" th:if="${model.subtitle}" th:text="${model.subtitle}">Table Report</p>
            </td>
            <td class="meta-box" style="vertical-align: middle;">
                <div><strong th:text="#{document.meta.issued_at}">Issued At:</strong> <span
                        th:text="${model.generatedAt}">13/08/2026</span></div>
                <div><strong th:text="#{document.meta.generated_by}">Generated By:</strong> <span
                        th:text="${model.generatedBy} ?: #{document.meta.system_user}">System</span></div>
                <div><strong th:text="#{document.meta.total_records}">Total Records:</strong> <span
                        th:text="${model.totalRecords}">0</span></div>
            </td>
        </tr>
    </table>

    <table class="data-table">
        <thead>
            <tr>
                <th th:each="header : ${model.headers}" th:text="${header}">Header</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${model.rows}">
                <td th:each="cell : ${row}" th:text="${cell}">Cell Value</td>
            </tr>
        </tbody>
    </table>

    <div class="footer-summary">
        <span th:text="#{document.table_list.total_prefix}">Total records listed:</span> <strong
            th:text="${model.totalRecords}">0</strong>. <span th:text="#{document.table_list.official_suffix}">Official
            document generated by OptiBienestar 360.</span>
    </div>

</body>

</html>
