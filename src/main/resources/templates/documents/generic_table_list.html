<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title th:text="${model.title} ?: #{document.table_list.default_title}">Record List</title>
    <style th:inline="css">
        @page {
            size: A4 landscape;
            margin: 12mm;

            @bottom-right {
                content: "Page " counter(page) " / " counter(pages);
                font-family: sans-serif;
                font-size: 8pt;
                color: #666666;
            }
            @bottom-left {
                content: "[[( ${reportFooter} ?: '' )]]";
                font-family: sans-serif;
                font-size: 8pt;
                color: #666666;
            }
        }

        body {
            font-family: sans-serif;
            font-size: 9pt;
            color: #333333;
            margin: 0;
            padding: 0;
        }

        .header-table {
            width: 100%;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .header-title {
            font-size: 16pt;
            font-weight: bold;
            color: #0056b3;
            margin: 0;
        }

        .header-subtitle {
            font-size: 10pt;
            color: #666666;
            margin: 2px 0 0 0;
        }

        .meta-box {
            text-align: right;
            font-size: 8.5pt;
            color: #555555;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .data-table th {
            background-color: #0056b3;
            color: #ffffff;
            font-weight: bold;
            padding: 6px 8px;
            text-align: left;
            font-size: 8.5pt;
            border: 1px solid #004085;
        }

        .data-table td {
            padding: 5px 8px;
            border: 1px solid #dddddd;
            font-size: 8.5pt;
            word-wrap: break-word;
        }

        .data-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .footer-summary {
            margin-top: 15px;
            font-size: 8.5pt;
            color: #555555;
            border-top: 1px solid #eeeeee;
            padding-top: 5px;
        }
    </style>
</head>

<body>

    <table class="header-table">
        <tr>
            <td style="vertical-align: middle;">
                <h1 class="header-title" th:text="${model.title} ?: #{document.table_list.default_title}">Record List
                </h1>
                <p class="header-subtitle" th:if="${model.subtitle}" th:text="${model.subtitle}">Table Report</p>
            </td>
            <td class="meta-box" style="vertical-align: middle;">
                <div><strong th:text="#{document.meta.issued_at}">Issued At:</strong> <span
                        th:text="${model.generatedAt}">13/08/2026</span></div>
                <div><strong th:text="#{document.meta.generated_by}">Generated By:</strong> <span
                        th:text="${model.generatedBy} ?: #{document.meta.system_user}">System</span></div>
                <div><strong th:text="#{document.meta.total_records}">Total Records:</strong> <span
                        th:text="${model.totalRecords}">0</span></div>
            </td>
        </tr>
    </table>

    <table class="data-table">
        <thead>
            <tr>
                <th th:each="header : ${model.headers}" th:text="${header}">Column</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${model.rows}">
                <td th:each="cell : ${row}" th:text="${cell}">Cell</td>
            </tr>
            <tr th:if="${#lists.isEmpty(model.rows)}">
                <td th:colspan="${#lists.size(model.headers) > 0 ? #lists.size(model.headers) : 1}" style="text-align: center; padding: 24px; color: #64748b; font-style: italic;" th:text="#{document.table_list.no_data}">
                    No records found to display
                </td>
            </tr>
        </tbody>
    </table>

    <div class="footer-summary">
        <span th:text="#{document.table_list.total_prefix}">Total records listed:</span> <strong
            th:text="${model.totalRecords}">0</strong>
    </div>

</body>

</html>
