<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body  { font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto; }
        h2    { color: #1f7a4d; border-bottom: 2px solid #1f7a4d; padding-bottom: 8px; }
        .field { margin: 10px 0; }
        .label { font-weight: bold; color: #555; display: inline-block; min-width: 130px; }
        .info-box { background: #eef7f1; padding: 14px; border-left: 4px solid #1f7a4d; }
        .footer { margin-top: 24px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <h2>Pago de tu afiliado revisado</h2>

    <p>Hola,</p>

    <div class="info-box">
        <p>
            El pago de <strong th:text="${fullName}"></strong> fue
            <strong th:text="${decision == 'APPROVED'} ? 'APROBADO' : 'RECHAZADO'"></strong>.
        </p>
    </div>

    <div class="field">
        <span class="label">Plan:</span>
        <span th:text="${planName}"></span>
    </div>
    <div class="field">
        <span class="label">Monto:</span>
        <span th:text="${amount} + ' ' + ${currency}"></span>
    </div>
    <div class="field" th:if="${reviewReason != null and !#strings.isEmpty(reviewReason)}">
        <span class="label">Nota del revisor:</span>
        <span th:text="${reviewReason}"></span>
    </div>

    <div class="footer">
        Centro Óptico Vicente — OptiBienestar 360<br>
        Este es un mensaje automático. No es necesario responderlo.
    </div>
</body>
</html>
