spring.application.name=optisaludplus
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SPRING MAIL SETUP
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:noreply@centroopticovicente.com}
mail.from-name=${MAIL_FROM_NAME:OptiSalud Plus}
mail.admin=${MAIL_ADMIN:admin@centroopticovicente.com}

# JWT SETUP
jwt.secret=${JWT_SECRET:changeme-at-least-32-bytes-long-secret}
jwt.issuer=${JWT_ISSUER:optisalud-plus}
jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4000}

# Trusted proxy — X-Forwarded-For resolved only from Traefik, not blindly accepted
server.forward-headers-strategy=NATIVE

# RFC 7807 problem+json for Spring MVC built-in exceptions
spring.mvc.problemdetails.enabled=true

# Base URL para tipos de error RFC 7807
problems.base-url=${PROBLEMS_BASE_URL:https://problems-optisalud.centroopticovicente.com}

# FLYWAY — runs as migration user (DDL privileges)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.user=${DATABASE_MIGRATION_USER:postgres}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD:changeme-dev}
# Passwords injected into V3__app_roles.sql at migration time
spring.flyway.placeholders.migration_db_password=${DATABASE_MIGRATION_PASSWORD:changeme-dev}
spring.flyway.placeholders.app_db_password=${DATABASE_PASSWORD:changeme-dev}
spring.flyway.placeholders.readonly_db_password=${DATABASE_READONLY_PASSWORD:changeme-dev}

# JPA
spring.jpa.properties.hibernate.default_schema=app

# OPENAPI / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# STORAGE (Cloudflare R2 in prod, MinIO in dev — override via env vars)
storage.r2.endpoint=${STORAGE_R2_ENDPOINT:http://localhost:9000}
storage.r2.access-key=${STORAGE_R2_ACCESS_KEY:minioadmin}
storage.r2.secret-key=${STORAGE_R2_SECRET_KEY:minioadmin}
storage.r2.bucket=${STORAGE_R2_BUCKET:optisalud-dev}
storage.r2.region=${STORAGE_R2_REGION:auto}

# ACTUATOR
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Disable Spring Cloud AWS autoconfiguration — S3Client is created manually in S3Config
# Prevents the SDK from calling EC2 metadata / STS at startup when no AWS env is present
spring.autoconfigure.exclude=\
  io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration,\
  io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
