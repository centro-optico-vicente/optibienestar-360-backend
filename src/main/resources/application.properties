spring.application.name=optibienestar360
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# LOCAL ENV FILE — optional .env at the project root is imported on startup so
# `./gradlew bootRun` and VS Code F5 pick up local overrides without exporting
# shell vars. Absent in CI / prod (real env vars win); see .env.example.
# Parsed as a .properties file (Spring Boot has no dedicated .env loader): plain
# KEY=value lines only, no `export`, no shell quoting — backslash is an escape.
spring.config.import=optional:file:./.env[.properties]

# SYSTEM INFO — surfaced by SystemInfoController at GET / and GET /v1.
# `app.version` and `app.version-date` come from VERSION / VERSION_DATE env vars
# (set by the Dockerfile at build time from BUILD_VERSION / BUILD_DATE ARGs,
# which the CI workflow populates from the GitHub release's tag_name and
# published_at). When not set (local dev / IDE run) the controller falls back to
# "dev-0.0.1" + the current timestamp so the response always contains data.
app.version=${VERSION:dev-0.0.1}
app.version-date=${VERSION_DATE:}

# SPRING MAIL SETUP
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:noreply@centroopticovicente.com}
mail.from-name=${MAIL_FROM_NAME:OptiBienestar 360}
mail.admin=${MAIL_ADMIN:admin@centroopticovicente.com}

# JWT SETUP
jwt.secret=${JWT_SECRET:changeme-at-least-32-bytes-long-secret}
jwt.issuer=${JWT_ISSUER:optibienestar-360}
jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# TOKEN BLACKLIST PROVIDER
# - redis (default): RedisTokenBlacklistService, survives restarts, supports multi-replica HA
# - memory:          MemoryTokenBlacklistService, in-process Caffeine cache, single-replica only.
#                    When set to memory, TokenBlacklistEnvironmentPostProcessor disables Redis
#                    auto-config + health checks so the backend can run without a Redis at all.
auth.token-blacklist.provider=${AUTH_TOKEN_BLACKLIST_PROVIDER:redis}

# SCHEDULED JOBS FRAMEWORK
# When true (default), the DynamicScheduledJobsRegistry loads rows from
# scheduled_jobs and arms cron triggers at startup. When false, the
# registry bean is not instantiated — the replica still serves HTTP
# (including the manual /run-now endpoint) but does not fire cron jobs.
# Use this to pin scheduling to one replica in a future multi-replica
# deployment; today (single replica) it should stay true everywhere.
app.scheduler.enabled=${SCHEDULER_ENABLED:true}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4000}
# Debug only: when true, also allow localhost / 127.0.0.1 on any port (origin patterns).
# MUST stay false in prod — see .ai/specs/03-security.md (CORS must not include localhost).
cors.allow-localhost=${CORS_ALLOW_LOCALHOST:false}

# Trusted proxy — X-Forwarded-For resolved only from Traefik, not blindly accepted
server.forward-headers-strategy=NATIVE

# Jetty's default request-header buffer (8KB) is too small for our JWT: it embeds
# every granted permission as a claim, and V78/V79's granular-permission split
# pushed a full-access role's Authorization header past 8KB (431 in prod). Raised
# with headroom for further permission growth; the real fix is trimming the JWT
# payload, tracked separately.
server.max-http-request-header-size=${MAX_HTTP_REQUEST_HEADER_SIZE:32KB}

# RFC 7807 problem+json for Spring MVC built-in exceptions
spring.mvc.problemdetails.enabled=true

# Base URL para tipos de error RFC 7807
problems.base-url=${PROBLEMS_BASE_URL:https://problems-optibienestar360.centroopticovicente.com}

# FLYWAY — runs as migration user (DDL privileges)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.user=${DATABASE_MIGRATION_USER:postgres}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD:changeme-dev}
# Passwords injected into V3__app_roles.sql at migration time
spring.flyway.placeholders.migration_db_password=${DATABASE_MIGRATION_PASSWORD:changeme-dev}
spring.flyway.placeholders.app_db_password=${DATABASE_PASSWORD:changeme-dev}
spring.flyway.placeholders.readonly_db_password=${DATABASE_READONLY_PASSWORD:changeme-dev}
# Per-role connection limits injected into V3__app_roles.sql — caps each role
# so it cannot exhaust max_connections. app default covers Hikari pool (20) × 2 replicas.
spring.flyway.placeholders.app_conn_limit=${DATABASE_APP_CONNECTION_LIMIT:50}
spring.flyway.placeholders.migration_conn_limit=${DATABASE_MIGRATION_CONNECTION_LIMIT:5}
spring.flyway.placeholders.readonly_conn_limit=${DATABASE_READONLY_CONNECTION_LIMIT:10}
# Runtime timeouts for optibienestar360_app (V3__app_roles.sql) — kill hung queries / idle txns
spring.flyway.placeholders.app_statement_timeout=${DATABASE_APP_STATEMENT_TIMEOUT:30s}
spring.flyway.placeholders.app_idle_in_transaction_timeout=${DATABASE_APP_IDLE_IN_TRANSACTION_TIMEOUT:60s}
# Seed users password expiration — false en prod, override a true en application-dev.properties
spring.flyway.placeholders.seed_password_never_expires=false

# JPA
spring.jpa.properties.hibernate.default_schema=app

# I18N — bundles, default locale, time zone (ADR 0010: Venezuela primary market).
# Locale resolution is hybrid (JWT claim > Accept-Language > app default) — wired
# in core/config/I18nConfig. Only `es` and `en` are first-class; regional
# variants like es-VE, es-MX, en-GB fall back automatically via ResourceBundle.
spring.messages.basename=messages,ValidationMessages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=es-VE
spring.jackson.time-zone=America/Caracas

# OPENAPI / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# STORAGE (Cloudflare R2 in prod, MinIO in dev — override via env vars)
# Object storage is opt-in: set storage.r2.enabled=true (env: STORAGE_R2_ENABLED)
# only when R2/MinIO is actually provisioned. When disabled, S3Client / S3Presigner
# / StorageService beans are not created, so no upload endpoints function — but the
# app boots even without valid storage credentials, which lets fresh deployments
# go live before R2 is configured.
storage.r2.enabled=${STORAGE_R2_ENABLED:false}
storage.r2.endpoint=${STORAGE_R2_ENDPOINT:http://localhost:9000}
storage.r2.access-key=${STORAGE_R2_ACCESS_KEY:minioadmin}
storage.r2.secret-key=${STORAGE_R2_SECRET_KEY:minioadmin}
storage.r2.bucket=${STORAGE_R2_BUCKET:optibienestar-360-dev}
storage.r2.region=${STORAGE_R2_REGION:auto}
# Second bucket for PUBLIC-visibility content (catalog images, etc.) — served
# directly by URL, no presigning. Falls back to the private bucket when unset
# so a single-bucket dev setup (e.g. bare MinIO) still boots.
storage.r2.public-bucket=${STORAGE_R2_PUBLIC_BUCKET:${storage.r2.bucket}}
storage.r2.public-base-url=${STORAGE_R2_PUBLIC_BASE_URL:}

# ACTUATOR
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Exclude MailHealthIndicator from the aggregate /actuator/health composite.
# Spring Boot auto-registers this indicator because JavaMailSender is on the
# classpath; when SMTP is unreachable it turns the aggregate DOWN → 503, and
# every external monitor pegging /actuator/health false-alarms even though
# no HTTP-serving concern is affected. Mail delivery is out-of-band (async
# queue in V28), so its availability is not a serving-readiness signal.
# The per-indicator endpoint /actuator/health/mail remains available for
# direct inspection when diagnosing SMTP problems.
management.health.mail.enabled=false

# Disable Spring Cloud AWS autoconfiguration — S3Client is created manually in S3Config
# Prevents the SDK from calling EC2 metadata / STS at startup when no AWS env is present
spring.autoconfigure.exclude=\
  io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration,\
  io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
