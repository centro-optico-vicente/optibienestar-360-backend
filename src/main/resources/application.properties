spring.application.name=optisaludplus
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SPRING MAIL SETUP
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:noreply@centroopticovicente.com}
mail.from-name=${MAIL_FROM_NAME:OptiSalud Plus}

# JWT SETUP
jwt.secret=${JWT_SECRET:changeme-at-least-32-bytes-long-secret}
jwt.issuer=${JWT_ISSUER:optisalud-plus}
jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# OPENAPI / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Disable Spring Cloud AWS autoconfiguration — S3Client is created manually in S3Config
# Prevents the SDK from calling EC2 metadata / STS at startup when no AWS env is present
spring.autoconfigure.exclude=\
  io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration,\
  io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
