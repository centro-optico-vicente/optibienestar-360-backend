# English base bundle for Jakarta Bean Validation messages. Covers `en`,
# `en-US`, `en-GB`, … via ResourceBundle fallback. Hibernate Validator
# looks up `{validation.xxx}` placeholders against this bundle via the
# `LocalValidatorFactoryBean` wired to the MessageSource (I18nConfig).

validation.locale.allowed=locale must be 'es', 'es-VE' or 'en'
validation.document_type.format=documentType must be 'V' or 'E'
validation.tax_document_type.format=taxDocumentType must be one of 'J','V','E','G','P'
validation.user_status.allowed_values=status must be 'ACTIVE', 'SUSPENDED' or 'LOCKED'
validation.code.uppercase.single=code must be a single uppercase letter
validation.code.uppercase.short=code must be 1-3 uppercase letters
validation.code.uppercase.medium=code must be 1-20 uppercase letters or underscore
validation.code.uppercase.long=code must be 1-40 uppercase letters or underscore
validation.iso_code.alpha2=isoCode must be 2 uppercase letters (ISO 3166-1 alpha-2)
