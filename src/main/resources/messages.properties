# Canonical fallback bundle. English text by convention so a key resolved here
# (i.e. when the requested locale has no _xx variant and no _es / _en bundle
# matches either) is at least readable rather than the raw key.
#
# Fill order: this file collects the canonical key list during Fase 2 / Fase 3
# refactors. `messages_es.properties` and `messages_en.properties` then mirror
# the keys with localized values. Regional variants (`_es_VE`, `_en_GB`, …) are
# created ONLY when a specific override is needed; ResourceBundle handles the
# fallback chain automatically.
