# H2 in PostgreSQL compatibility mode — supports CITEXT, INET, partial indexes
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway disabled in the local H2 test profile: V1 issues `CREATE EXTENSION`
# which H2 cannot parse. CI (.github/workflows/ci.yaml) runs the suite against
# a real Postgres 15 container where Flyway is enabled and migrations execute.
spring.flyway.enabled=false
